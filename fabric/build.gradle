plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'dev.mixinmcp.decompile'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixin_squared_version}"))

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    modImplementation("me.fzzyhmstrs:fzzy_config:${fzzy_config}") {
        exclude(group: "me.lucko")
        exclude(group: "com.terraformersmc")
    }

    // Compats (compile + dev runtime)
    modCompileOnly "maven.modrinth:thermoo:${project.thermoo_fabric_version}"
    modLocalRuntime "maven.modrinth:thermoo:${project.thermoo_fabric_version}"

    modCompileOnly "curse.maven:farmers-delight-refabricated-993166:${farmersdelight_fabric_file}"
    modLocalRuntime "curse.maven:farmers-delight-refabricated-993166:${farmersdelight_fabric_file}"

    modCompileOnly "squeek.appleskin:appleskin-fabric:${appleskin_fabric_version}"
    modLocalRuntime "squeek.appleskin:appleskin-fabric:${appleskin_fabric_version}"

    modCompileOnly "maven.modrinth:mana-attributes:${mana_attributes_version}"
    modLocalRuntime "maven.modrinth:mana-attributes:${mana_attributes_version}"

    modCompileOnly "maven.modrinth:stamina-attributes:${stamina_attributes_version}"
    // modLocalRuntime "maven.modrinth:stamina-attributes:${stamina_attributes_version}"

    modCompileOnly "curse.maven:rpgmana-1021902:${rpgmana_fabric_file}"

    modCompileOnly "maven.modrinth:spell-engine:${spell_engine_version}-fabric"

    // Runtime-only testing & transitive deps
    modLocalRuntime "maven.modrinth:frostiful:${frostiful_fabric_version}"
    modLocalRuntime "maven.modrinth:scorchful:${scorchful_fabric_version}"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}"
    modLocalRuntime "org.ladysnake:satin:${satin_version}"
    modLocalRuntime "maven.modrinth:resource-bar-api:${resource_bar_api_version}"
    modLocalRuntime "maven.modrinth:cloth-config:${cloth_config_version}+fabric"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        configureEach {
            ideConfigGenerated(true)
            property('fabric.log.level', 'debug')
            vmArg('-Xmx6G')
            vmArg('-Xms2G')
        }
        client {
            client()
            setConfigName('Fabric Client')
            runDir('runs/client')
            programArgs('--username', 'Dev')
            // Fabric randomizes devuser name (Player###), we manually specify a fixed one matching Neoforge
        }
        clientExtra {
            client()
            setConfigName('Fabric ClientExtra')
            runDir('runs/client2')
            programArgs('--username', 'Dev2')
        }
        server {
            server()
            setConfigName('Fabric Server')
            runDir('runs/server')
        }
        uiHarness {
            client()
            setConfigName('Fabric UI Harness')
            runDir('runs/harness')
            programArgs('--username', 'Dev', '--width', '854', '--height', '480')
            environmentVariable('DRB_UI_HARNESS', 'watch')
            environmentVariable('DRB_UI_HARNESS_DIR', rootProject.file('.ui-harness').absolutePath)
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

if (project.findProperty('fabric_modpack_path')) {
    def fabricModpackDest = new File(project.fabric_modpack_path).with { f ->
        f.absolute ? f : new File(System.getProperty('user.home'), project.fabric_modpack_path)
    }
    tasks.register('sendToModpackFab', Copy) {
        group = 'publishing'
        description = "Copies the Fabric dev jar into ${fabricModpackDest}"
        dependsOn tasks.named('remapJar')
        from tasks.named('remapJar').flatMap { it.archiveFile }
        into fabricModpackDest
        rename { String fileName ->
            fileName.replace(project.version.toString(), 'dev')
        }
        // Loaders don't guarantee which duplicate mod jar wins, so remove this
        // mod's versioned jars from the destination before sending the dev jar
        doFirst {
            def prefix = "${project.base.archivesName.get()}-"
            fabricModpackDest.listFiles()?.each { existing ->
                if (existing.name.startsWith(prefix) && existing.name.endsWith('.jar') && existing.name != "${prefix}dev.jar") {
                    println "Deleted versioned jar: ${existing.name}"
                    existing.delete()
                }
            }
        }
        doLast {
            println "Fabric dev jar sent to: ${fabricModpackDest}"
        }
    }
}
