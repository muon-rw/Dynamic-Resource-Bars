plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'dev.mixinmcp.decompile'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {

    // MixinSquared, Sponge Mixin, and MixinExtras: compileOnly in common; loader projects run APs.
    compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixin_squared_version}")
    compileOnly("net.fabricmc:sponge-mixin:${fabric_mixin_version}")
    compileOnly("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")

    // Fzzy Config
    implementation("me.fzzyhmstrs:fzzy_config:${fzzy_config}")
    compileOnly "maven.modrinth:thermoo:${project.thermoo_neoforge_version}"

    compileOnly "curse.maven:farmers-delight-398521:${farmersdelight_neoforge_file}"
    compileOnly "curse.maven:paragliders-289240:${paragliders_neoforge_file}"
    compileOnly "curse.maven:rpgmana-1021902:${rpgmana_neoforge_file}"
    compileOnly "maven.modrinth:spell-engine:${spell_engine_version}-neoforge"
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}") { transitive = false }
    compileOnly("io.redspace:irons_spellbooks:${irons_spellbooks_version}") { transitive = false }
    compileOnly("io.redspace:irons_lib:${irons_lib_version}") { transitive = false }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
