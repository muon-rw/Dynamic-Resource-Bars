import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'dev.mixinmcp.decompile'
}

// Loom provides `localRuntime` out of the box; MDG does not, so wire it up here.
// Deps in `localRuntime` are on the dev runtime classpath but aren't exposed in
// `runtimeElements`, so they don't propagate transitively to maven consumers.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
    testRuntimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    implementation("me.fzzyhmstrs:fzzy_config:${fzzy_config}+neoforge")

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixin_squared_version}"))
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixin_squared_version}")) {
        version { strictly '[0.3.4,)'; prefer "${mixin_squared_version}" }
    }

    // Compats (compile + dev runtime)
    compileOnly "maven.modrinth:thermoo:${project.thermoo_neoforge_version}"
    localRuntime "maven.modrinth:thermoo:${project.thermoo_neoforge_version}"

    compileOnly "squeek.appleskin:appleskin-neoforge:${appleskin_neoforge_version}"
    localRuntime "squeek.appleskin:appleskin-neoforge:${appleskin_neoforge_version}"

    compileOnly "curse.maven:farmers-delight-398521:${farmersdelight_neoforge_file}"
    localRuntime "curse.maven:farmers-delight-398521:${farmersdelight_neoforge_file}"

    compileOnly "curse.maven:paragliders-289240:${paragliders_neoforge_file}"
    localRuntime "curse.maven:paragliders-289240:${paragliders_neoforge_file}"

    compileOnly "curse.maven:rpgmana-1021902:${rpgmana_neoforge_file}"

    compileOnly "maven.modrinth:spell-engine:${spell_engine_version}-neoforge"

    // Compats (compile-only)
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}") { transitive = false }
    compileOnly("io.redspace:irons_spellbooks:${irons_spellbooks_version}") { transitive = false }
    compileOnly("io.redspace:irons_lib:${irons_lib_version}") { transitive = false }

    // Runtime-only testing & transitive deps
    localRuntime "maven.modrinth:frostiful:${frostiful_neoforge_version}"
    localRuntime "maven.modrinth:scorchful:${scorchful_neoforge_version}"
    localRuntime "maven.modrinth:forgified-fabric-api:${forgified_fabric_api_version}"
    localRuntime "maven.modrinth:velvet-api:${velvet_api_version}"
    localRuntime "maven.modrinth:sparkweave:${sparkweave_version}"
    localRuntime "maven.modrinth:cloth-config:${cloth_config_version}+neoforge"
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.logging.file.level', 'info'
            jvmArgument '-Xmx6G'
            jvmArgument '-Xms2G'
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }

        clientExtra {
            client()
            gameDirectory = this.mkdir(this.file("runs/client2"))
            programArguments.addAll('--username', 'Dev2')
        }

        uiHarness {
            client()
            ideName = "NeoForge UI Harness (${project.path})"
            gameDirectory = this.mkdir(this.file("runs/harness"))
            programArguments.addAll('--width', '854', '--height', '480')
            environment('DRB_UI_HARNESS', 'watch')
            environment('DRB_UI_HARNESS_DIR', rootProject.file('.ui-harness').absolutePath)
        }

        data {
            data()
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

if (project.findProperty('neoforge_modpack_path')) {
    def neoModpackMods = new File(project.neoforge_modpack_path).with { f ->
        (f.absolute ? f : new File(System.getProperty('user.home'), project.neoforge_modpack_path)).toPath()
    }
    tasks.register('sendToModpack') {
        group = 'publishing'
        description = "Copies the NeoForge dev jar into ${neoModpackMods}"
        dependsOn tasks.named('jar')
        def builtJar = tasks.named('jar').flatMap { it.archiveFile }
        def builtName = tasks.named('jar').flatMap { it.archiveFileName }
        doLast {
            def jarName = builtName.get()
            def versionedPrefix = jarName.substring(0, jarName.indexOf(project.version.toString()))
            def deployedJar = neoModpackMods.resolve(jarName.replace(project.version.toString(), 'dev'))
            def staged = deployedJar.resolveSibling("${deployedJar.fileName}.staged".toString())
            Files.copy(builtJar.get().asFile.toPath(), staged, StandardCopyOption.REPLACE_EXISTING)
            try {
                Files.deleteIfExists(deployedJar)
            } catch (java.nio.file.FileSystemException e) {
                Files.delete(staged)
                throw new GradleException("${deployedJar.fileName} is held open by a running pack; close it and rerun", e)
            }
            Files.move(staged, deployedJar)
            println "Mod JAR sent to modpack folder: ${deployedJar.fileName}"

            // FML picks the published jar over the dev jar, so we disable the published one while testing.
            Files.list(deployedJar.parent).withCloseable { files ->
                files.toList().findAll {
                    it.fileName.toString().startsWith(versionedPrefix) && it.fileName.toString().endsWith('.jar') && it != deployedJar
                }.each { versioned ->
                    Files.move(versioned, versioned.resolveSibling("${versioned.fileName}.disabled".toString()), StandardCopyOption.REPLACE_EXISTING)
                    println "Disabled published jar: ${versioned.fileName}"
                }
            }
        }
    }
}
